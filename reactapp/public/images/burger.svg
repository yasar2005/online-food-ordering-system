  <line x1="150" y1="172" x2="180" y2="185" stroke="#4E342E" stroke-width="3" opacity="0.6"/>
  <line x1="175" y1="170" x2="205" y2="183" stroke="#4E342E" stroke-width="3" opacity="0.6"/>
  <line x1="200" y1="170" x2="230" y2="183" stroke="#4E342E" stroke-width="3" opacity="0.6"/>
