  <path d="M 95 215 Q 120 205 145 215 Q 170 205 195 215 Q 220 205 245 215 Q 270 205 295 215 Q 280 220 255 218 Q 230 225 205 218 Q 180 225 155 218 Q 130 225 105 218 Z" fill="#27ae60"/>
