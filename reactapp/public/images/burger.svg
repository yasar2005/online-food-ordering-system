  <!-- Sesame seeds -->
  <ellipse cx="175" cy="135" rx="6" ry="3" fill="#f5deb3" transform="rotate(-20,175,135)"/>
  <ellipse cx="200" cy="125" rx="6" ry="3" fill="#f5deb3" transform="rotate(10,200,125)"/>
  <ellipse cx="225" cy="132" rx="6" ry="3" fill="#f5deb3" transform="rotate(-15,225,132)"/>
