  <ellipse cx="215" cy="143" rx="5" ry="3" fill="#f5deb3" transform="rotate(-10,215,143)"/>
  <rect x="100" y="20" width="200" height="40" rx="8" fill="rgba(0,0,0,0.4)"/>
  <text x="200" y="46" text-anchor="middle" fill="white" font-size="18" font-family="Arial" font-weight="bold">🍔 Smash Burger</text>
