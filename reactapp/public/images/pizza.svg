<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Pizza base -->
  <circle cx="200" cy="165" r="130" fill="#c8860a"/>
  <circle cx="200" cy="165" r="120" fill="#e8a020"/>
  <!-- Sauce -->
  <circle cx="200" cy="165" r="108" fill="#c0392b"/>
  <!-- Cheese -->
  <circle cx="200" cy="165" r="100" fill="#f1c40f" opacity="0.9"/>
  <!-- Cheese blobs -->
  <ellipse cx="180" cy="150" rx="25" ry="20" fill="#fffde7"/>
  <ellipse cx="220" cy="155" rx="22" ry="18" fill="#fffde7"/>
  <ellipse cx="195" cy="185" rx="28" ry="18" fill="#fffde7"/>
  <ellipse cx="165" cy="178" rx="20" ry="16" fill="#fffde7"/>
  <ellipse cx="230" cy="180" rx="20" ry="15" fill="#fffde7"/>
  <!-- Pepperoni -->
  <circle cx="185" cy="148" r="14" fill="#c0392b"/>
  <circle cx="185" cy="148" r="11" fill="#e74c3c"/>
  <circle cx="215" cy="152" r="13" fill="#c0392b"/>
  <circle cx="215" cy="152" r="10" fill="#e74c3c"/>
  <circle cx="200" cy="178" r="14" fill="#c0392b"/>
  <circle cx="200" cy="178" r="11" fill="#e74c3c"/>
  <circle cx="168" cy="172" r="12" fill="#c0392b"/>
  <circle cx="168" cy="172" r="9" fill="#e74c3c"/>
  <circle cx="232" cy="175" r="12" fill="#c0392b"/>
  <circle cx="232" cy="175" r="9" fill="#e74c3c"/>
  <!-- Basil leaves -->
  <ellipse cx="195" cy="160" rx="8" ry="5" fill="#27ae60" transform="rotate(-30,195,160)"/>
  <ellipse cx="210" cy="168" rx="7" ry="4" fill="#27ae60" transform="rotate(20,210,168)"/>
  <!-- Crust -->
  <path d="M 75 165 A 125 125 0 0 1 325 165" fill="none" stroke="#c8860a" stroke-width="18"/>
  <rect x="100" y="20" width="200" height="40" rx="8" fill="rgba(0,0,0,0.4)"/>
  <text x="200" y="46" text-anchor="middle" fill="white" font-size="18" font-family="Arial" font-weight="bold">🍕 Pepperoni Pizza</text>
</svg>
