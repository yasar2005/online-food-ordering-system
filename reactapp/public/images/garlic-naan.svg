<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#8B4513"/>
  <!-- Tandoor background -->
  <ellipse cx="200" cy="260" rx="180" ry="30" fill="#5D4037" opacity="0.5"/>
  <!-- Naan bread -->
  <ellipse cx="200" cy="170" rx="140" ry="90" fill="#c8860a" transform="rotate(-10,200,170)"/>
  <ellipse cx="200" cy="168" rx="135" ry="85" fill="#e8c97a" transform="rotate(-10,200,168)"/>
  <!-- Char spots -->
  <ellipse cx="155" cy="140" rx="18" ry="12" fill="#8B4513" opacity="0.6" transform="rotate(-10,155,140)"/>
  <ellipse cx="230" cy="155" rx="15" ry="10" fill="#8B4513" opacity="0.5" transform="rotate(-10,230,155)"/>
  <ellipse cx="185" cy="195" rx="20" ry="12" fill="#8B4513" opacity="0.5" transform="rotate(-10,185,195)"/>
  <!-- Garlic pieces -->
  <ellipse cx="170" cy="155" rx="8" ry="6" fill="#fffde7" transform="rotate(-20,170,155)"/>
  <ellipse cx="200" cy="148" rx="8" ry="6" fill="#fffde7" transform="rotate(10,200,148)"/>
  <ellipse cx="225" cy="165" rx="8" ry="6" fill="#fffde7" transform="rotate(-15,225,165)"/>
  <ellipse cx="185" cy="178" rx="7" ry="5" fill="#fffde7" transform="rotate(5,185,178)"/>
  <!-- Butter sheen -->
  <ellipse cx="200" cy="165" rx="80" ry="50" fill="#f1c40f" opacity="0.2" transform="rotate(-10,200,165)"/>
  <!-- Coriander -->
  <circle cx="195" cy="160" r="4" fill="#27ae60"/>
  <circle cx="215" cy="170" r="3" fill="#27ae60"/>
  <circle cx="178" cy="168" r="3" fill="#27ae60"/>
  <rect x="100" y="20" width="200" height="40" rx="8" fill="rgba(0,0,0,0.4)"/>
  <text x="200" y="46" text-anchor="middle" fill="white" font-size="18" font-family="Arial" font-weight="bold">🫓 Garlic Naan</text>
</svg>
