<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff8c42"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </radialGradient>
    <radialGradient id="gravy" cx="50%" cy="60%" r="50%">
      <stop offset="0%" style="stop-color:#e67e22"/>
      <stop offset="100%" style="stop-color:#a04000"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Bowl -->
  <ellipse cx="200" cy="200" rx="160" ry="80" fill="#8B4513"/>
  <ellipse cx="200" cy="185" rx="155" ry="70" fill="url(#gravy)"/>
  <!-- Gravy surface -->
  <ellipse cx="200" cy="175" rx="140" ry="60" fill="#e67e22" opacity="0.9"/>
  <!-- Chicken pieces -->
  <ellipse cx="160" cy="170" rx="35" ry="25" fill="#c0392b"/>
  <ellipse cx="160" cy="168" rx="33" ry="23" fill="#e74c3c"/>
  <ellipse cx="240" cy="175" rx="30" ry="22" fill="#c0392b"/>
  <ellipse cx="240" cy="173" rx="28" ry="20" fill="#e74c3c"/>
  <ellipse cx="200" cy="160" rx="28" ry="20" fill="#c0392b"/>
  <ellipse cx="200" cy="158" rx="26" ry="18" fill="#e74c3c"/>
  <!-- Cream swirl -->
  <path d="M 170 155 Q 200 145 230 155 Q 215 148 200 150 Q 185 148 170 155" fill="none" stroke="#fff" stroke-width="3" opacity="0.8"/>
  <!-- Coriander -->
  <circle cx="185" cy="155" r="4" fill="#27ae60"/>
  <circle cx="215" cy="158" r="3" fill="#27ae60"/>
  <circle cx="200" cy="152" r="3" fill="#27ae60"/>
  <!-- Steam -->
  <path d="M 160 120 Q 155 105 160 90" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
  <path d="M 200 115 Q 195 100 200 85" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
  <path d="M 240 120 Q 235 105 240 90" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
  <!-- Label -->
  <rect x="80" y="20" width="240" height="40" rx="8" fill="rgba(0,0,0,0.4)"/>
  <text x="200" y="46" text-anchor="middle" fill="white" font-size="18" font-family="Arial" font-weight="bold">🍗 Butter Chicken</text>
</svg>
