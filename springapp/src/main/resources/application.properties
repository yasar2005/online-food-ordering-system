# Production and local database settings. Override with environment variables in deployment.
# Example: SPRING_DATASOURCE_URL=jdbc:mysql://hostname:3306/OnlineFood
#          SPRING_DATASOURCE_USERNAME=dbuser
#          SPRING_DATASOURCE_PASSWORD=dbpass
#          SPRING_JPA_HIBERNATE_DDL_AUTO=update
#          SERVER_PORT=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/OnlineFood}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
server.port=${SERVER_PORT:8080}
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:3000}
