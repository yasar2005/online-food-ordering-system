<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h2>Restaurant Dashboard</h2>
        
        <h3>Add Menu Item</h3>
        <form method="post" action="/restaurant/menu/add">
            <input type="text" name="name" placeholder="Item Name" required>
            <input type="text" name="description" placeholder="Description" required>
            <input type="number" step="0.01" name="price" placeholder="Price" required>
            <input type="number" name="stock" placeholder="Stock" required>
            <button type="submit">Add Item</button>
        </form>

        <h3>Menu Items</h3>
        <div th:each="item : ${menuItems}" class="menu-item">
            <h4 th:text="${item.name}"></h4>
            <p th:text="${item.description}"></p>
            <p>Price: $<span th:text="${item.price}"></span> | Stock: <span th:text="${item.stock}"></span></p>
            <form method="post" th:action="@{/restaurant/menu/delete/{id}(id=${item.id})}" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </div>

        <h3>Orders</h3>
        <div th:each="order : ${orders}" class="order-item">
            <p>Order #<span th:text="${order.id}"></span> - $<span th:text="${order.totalPrice}"></span></p>
            <form method="post" th:action="@{/restaurant/order/status/{id}(id=${order.id})}">
                <select name="status">
                    <option value="PENDING">Pending</option>
                    <option value="CONFIRMED">Confirmed</option>
                    <option value="READY">Ready</option>
                    <option value="COMPLETED">Completed</option>
                </select>
                <button type="submit">Update Status</button>
            </form>
        </div>
        
        <a href="/logout">Logout</a>
    </div>
</body>
</html>
