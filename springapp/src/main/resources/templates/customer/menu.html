<!DOCTYPE html>
<html>
<head>
    <title>Menu - Food Ordering</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h2>Available Menu Items</h2>
        <div th:each="item : ${menuItems}" class="menu-item">
            <h3 th:text="${item.name}"></h3>
            <p th:text="${item.description}"></p>
            <p>Price: $<span th:text="${item.price}"></span></p>
            <p>Stock: <span th:text="${item.stock}"></span></p>
        </div>
        <a href="/customer/order">Place Order</a> | 
        <a href="/customer/orders">View My Orders</a> | 
        <a href="/logout">Logout</a>
    </div>
</body>
</html>
